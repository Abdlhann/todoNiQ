<!DOCTYPE html>
<html lang="id">
<head>
	<meta charset='utf-8'>
	<meta name='viewport' content='width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes'>
	<meta name='description' content='TodoNiQ - Aplikasi manajemen tugas yang modern dan responsif untuk semua device'>
	<meta name='keywords' content='todo, task manager, productivity, manajemen tugas, todolist'>
	<meta name='author' content='TodoNiQ Team'>
	<meta name='theme-color' content='#1a1a2e'>
	
	<!-- Mobile Optimization -->
	<meta name='mobile-web-app-capable' content='yes'>
	<meta name='apple-mobile-web-app-capable' content='yes'>
	<meta name='apple-mobile-web-app-status-bar-style' content='black-translucent'>
	<meta name='apple-mobile-web-app-title' content='TodoNiQ'>
	
	<!-- Open Graph / Social Media -->
	<meta property='og:type' content='website'>
	<meta property='og:title' content='TodoNiQ - Task Management App'>
	<meta property='og:description' content='Aplikasi manajemen tugas yang modern dan responsif'>
	<meta property='og:site_name' content='TodoNiQ'>
	<meta property='og:image' content='/images/logo.jpeg'>
	
	<!-- Twitter Card -->
	<meta name='twitter:card' content='summary'>
	<meta name='twitter:title' content='TodoNiQ - Task Management App'>
	<meta name='twitter:description' content='Aplikasi manajemen tugas yang modern dan responsif'>
	<meta name='twitter:image' content='/images/logo.jpeg'>


	<title>TodoNiQ - Task Management App</title>

	<!-- Favicons -->
	<link rel='icon' type='image/jpeg' href='./images/logo.jpeg'>
	<link rel='apple-touch-icon' href='./images/logo.jpeg'>
	<link rel='shortcut icon' type='image/jpeg' href='./images/logo.jpeg'>
	
	<!-- Stylesheets -->
	<link rel='stylesheet' href='./global.css'>
	<link rel='stylesheet' href='./build/bundle.css'>

	<!-- Preconnect for performance -->
	<link rel='preconnect' href='https://fonts.googleapis.com'>
	<link rel='preconnect' href='https://fonts.gstatic.com' crossorigin>
	<link rel='preconnect' href='https://cdnjs.cloudflare.com'>

	<script defer src='./build/bundle.js'></script>
</head>

<body>
	<noscript>
		<div style="padding: 2rem; text-align: center; color: white; background: #1a1a2e; min-height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column;">
			<h1>⚠️ JavaScript Diperlukan</h1>
			<p>TodoNiQ memerlukan JavaScript untuk berfungsi dengan baik.</p>
			<p>Silakan aktifkan JavaScript di browser Anda.</p>
		</div>
	</noscript>
</body>
</html>
